name: Build labelled SIT comparison references
on:
  push:
    paths: ['sit_reference.py', 'plot_sit.py', '.github/workflows/sit-reference.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install numpy matplotlib
      - run: python plot_sit.py
      - name: Preserve labelled comparison audio and plots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add references/sit research/sit-waveform-fft.svg research/sit-waveform-fft.png
          if ! git diff --cached --quiet; then
            git commit -m "Add explicitly generated Bellcore SIT references and waveform FFT comparison"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
