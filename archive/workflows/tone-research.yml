name: Tone codec experiments
on:
  push:
    paths: ['tone_experiments.py', '.github/workflows/tone-research.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Install reference decoder tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - run: python tone_experiments.py
      - name: Preserve experiment results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/tone-codec-experiments.json
          if ! git diff --cached --quiet; then
            git commit -m "Record FFT tests of stateful G726 tone hypotheses"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
